name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-freeze:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce legacy feature freeze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HOTFIX_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'legacy-hotfix-approved') }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD | grep -E '^(main\.go|internal/|web/)' || true)"
          if [ -n "$changed" ] && [ "$HOTFIX_APPROVED" != "true" ]; then
            echo "Legacy system is frozen. Add legacy-hotfix-approved for an allowed blocking fix:"
            echo "$changed"
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            go.sum
            platform/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Contract and formatting
        run: |
          go run ./tools/contractgen -check
          go run ./tools/schema-gen -check
          test -z "$(find . \( -path ./.git -o -path ./apps/web/node_modules \) -prune -o -name '*.go' -print | xargs gofmt -l)"
      - name: Go tests and vet
        run: |
          go test -count=1 ./...
          go vet ./...
          cd platform
          go test -count=1 ./...
          go vet ./...
      - name: Web typecheck and build
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run test -- --run
          npm run build

  release-checks:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: |
            go.sum
            platform/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Race tests
        run: |
          go test -race -count=1 ./...
          cd platform && go test -race -count=1 ./...
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1.27.2 lint api/openapi/v1.yaml
      - name: Compose integration smoke
        run: sh scripts/compose-smoke.sh
      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-logs
          path: compose-smoke.log
      - name: Go vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          cd platform && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: NPM dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Filesystem and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

global
    log stdout format raw local0
    maxconn 2048
    stats socket /var/run/haproxy/admin.sock mode 600 level admin

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 125s
    timeout server 125s
    timeout http-request 120s
    timeout http-keep-alive 10s
    timeout queue 2s
    timeout check 1s
    retries 0
    # Preserve the API envelope for proxy-generated failures; no request replay.
    http-error status 400 content-type application/json lf-string '{"error":{"code":"INVALID_REQUEST","message":"invalid request","request_id":"%[var(txn.request_id)]"}}'
    http-error status 408 content-type application/json lf-string '{"error":{"code":"REQUEST_TIMEOUT","message":"request timed out","request_id":"%[var(txn.request_id)]"}}'
    http-error status 413 content-type application/json lf-string '{"error":{"code":"BODY_TOO_LARGE","message":"request body too large","request_id":"%[var(txn.request_id)]"}}'
    http-error status 502 content-type application/json lf-string '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"upstream service unavailable","request_id":"%[var(txn.request_id)]"}}'
    http-error status 503 content-type application/json lf-string '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"upstream service unavailable","request_id":"%[var(txn.request_id)]"}}'
    http-error status 504 content-type application/json lf-string '{"error":{"code":"UPSTREAM_TIMEOUT","message":"upstream service timed out","request_id":"%[var(txn.request_id)]"}}'

resolvers docker_dns
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 1s

frontend public
    bind :8080
    log-format "%ci:%cp %ft %b/%s status=%ST bytes=%B queue_ms=%Tw connect_ms=%Tc response_ms=%Tr total_ms=%Ta request_id=%[var(txn.request_id)]"
    # A production TLS listener must terminate here and supply its certificate.
    http-request set-var(txn.request_id) uuid()
    http-request set-var(txn.request_id) req.hdr(X-Request-ID) if { req.hdr(X-Request-ID) -m reg ^[A-Za-z0-9._:-]{1,128}$ }
    http-request set-header X-Request-ID %[var(txn.request_id)]
    http-request del-header Forwarded
    http-request del-header X-Forwarded-Host
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    acl has_origin req.hdr(Origin) -m found
    acl allowed_origin req.hdr(Origin) -m str "${CORS_ORIGIN_1}" "${CORS_ORIGIN_2}" http://localhost:5173 http://127.0.0.1:5173
    http-request set-var(txn.origin) req.hdr(Origin) if allowed_origin
    http-after-response set-header X-Request-ID %[var(txn.request_id)]
    http-after-response set-header X-Content-Type-Options nosniff
    http-after-response set-header X-Frame-Options DENY
    http-after-response set-header Referrer-Policy no-referrer
    http-after-response set-header Access-Control-Allow-Origin %[var(txn.origin)] if { var(txn.origin) -m found }
    http-after-response set-header Access-Control-Allow-Credentials true if { var(txn.origin) -m found }
    http-after-response set-header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" if { var(txn.origin) -m found }
    http-after-response set-header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" if { var(txn.origin) -m found }
    http-after-response set-header Vary Origin if { var(txn.origin) -m found }
    http-request return status 403 content-type application/json lf-string '{"error":{"code":"ORIGIN_NOT_ALLOWED","message":"request origin is not allowed","request_id":"%[var(txn.request_id)]"}}' if has_origin !allowed_origin
    http-request return status 204 if METH_OPTIONS allowed_origin
    http-request del-header Origin
    http-request return status 413 content-type application/json lf-string '{"error":{"code":"BODY_TOO_LARGE","message":"request body too large","request_id":"%[var(txn.request_id)]"}}' if { req.hdr_val(Content-Length) gt 104857600 }
    http-request return status 200 content-type application/json string '{"status":"ready","service":"haproxy"}' if { path /health/ready /health/live }
    acl private_path path_beg /internal /metrics /debug
    acl encoded_api path_reg -i ^/api/.*(%2f|%5c|%2e)
    http-request return status 404 content-type application/json lf-string '{"error":{"code":"NOT_FOUND","message":"resource not found","request_id":"%[var(txn.request_id)]"}}' if private_path or encoded_api
    acl iam_route path_reg ^/api/v1/(auth|users|departments)(/|$)
    acl asset_route path_reg ^/api/v1/(asset-types|assets|migrations)(/|$)
    acl task_route path_reg ^/api/v1/(import-jobs|export-jobs|tasks|reporting)(/|$)
    acl governance_route path_reg ^/api/v1/(workflows|risks)(/|$)
    acl api_path path_reg ^/api(/|$)
    http-request return status 404 content-type application/json lf-string '{"error":{"code":"NOT_FOUND","message":"resource not found","request_id":"%[var(txn.request_id)]"}}' if api_path !iam_route !asset_route !task_route !governance_route
    use_backend iam_pool if iam_route
    use_backend asset_pool if asset_route
    use_backend task_pool if task_route
    use_backend governance_pool if governance_route
    default_backend web_pool

# Internal listeners are reachable only on the private Docker network.
frontend iam_internal
    bind :18081
    default_backend iam_pool
frontend asset_internal
    bind :18082
    default_backend asset_pool
frontend governance_internal
    bind :18083
    default_backend governance_pool
frontend task_internal
    bind :18084
    default_backend task_pool

frontend monitoring
    bind :18090
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s

backend iam_pool
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host iam-service
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server-template iam 1-8 iam-service:8081 check resolvers docker_dns init-addr none
backend asset_pool
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host asset-service
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server-template asset 1-8 asset-service:8082 check resolvers docker_dns init-addr none
backend task_pool
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host task-report-service
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server-template task 1-8 task-report-service:8084 check resolvers docker_dns init-addr none
backend governance_pool
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host governance-service
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server-template governance 1-8 governance-service:8083 check resolvers docker_dns init-addr none
backend web_pool
    balance roundrobin
    option httpchk GET /
    default-server inter 2s fall 2 rise 2
    server-template web 1-8 web:8080 check resolvers docker_dns init-addr none

openapi: 3.1.0
info:
  title: Asset Governance Platform API
  version: 3.0.0-phase3
  description: 阶段三任务中心、导入导出与数据迁移公共契约。
  license:
    name: Proprietary
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      summary: 检查进程存活状态
      operationId: healthLive
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      summary: 检查服务就绪状态
      operationId: healthReady
      security: []
      responses:
        "200":
          description: 服务可接收流量
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/login:
    post:
      summary: 使用用户名和密码登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功并通过安全 Cookie 设置刷新令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      summary: 轮换刷新令牌并签发访问令牌
      operationId: refreshToken
      security: []
      responses:
        "200":
          description: 令牌轮换成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: 注销当前会话
      operationId: logout
      responses:
        "204": { description: 已注销 }
        "401": { $ref: "#/components/responses/Error" }
  /auth/change-password:
    post:
      summary: 修改当前用户密码并撤销已有会话
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: 密码已修改，调用方需要重新登录 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      summary: 获取当前登录用户
      operationId: currentUser
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/authorize:
    post:
      summary: 获取当前用户的服务端授权上下文
      operationId: authorizeAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /users:
    get:
      summary: 管理员查询用户
      operationId: listUsers
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: 管理员创建用户
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /users/{id}/access:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      summary: 管理员更新用户角色、部门范围和启用状态
      operationId: updateUserAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserAccessRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /departments:
    get:
      summary: 管理员查询部门树
      operationId: listDepartments
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: 管理员创建部门
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDepartmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /asset-types:
    get:
      summary: 查询可用资产类型
      operationId: listAssetTypes
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /asset-types/{type}/schema:
    parameters:
      - $ref: "#/components/parameters/AssetType"
    get:
      summary: 获取指定资产类型的 Schema
      operationId: getAssetSchema
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /assets/{type}:
    parameters:
      - $ref: "#/components/parameters/AssetType"
    get:
      summary: 分页查询指定类型资产
      operationId: listAssets
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: 创建指定类型资产
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAssetRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /assets/{type}/{id}:
    parameters:
      - $ref: "#/components/parameters/AssetType"
      - $ref: "#/components/parameters/ResourceID"
    get:
      summary: 获取单条资产
      operationId: getAsset
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: 更新单条资产
      operationId: updateAsset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAssetRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: 软删除单条资产
      operationId: deleteAsset
      responses:
        "204": { description: 已软删除 }
        "403": { $ref: "#/components/responses/Error" }
  /assets/{type}/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/AssetType"
      - $ref: "#/components/parameters/ResourceID"
    post:
      summary: 恢复已软删除资产
      operationId: restoreAsset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assets/{type}/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/AssetType"
      - $ref: "#/components/parameters/ResourceID"
    get:
      summary: 查询资产基础版本记录
      operationId: listAssetVersions
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /import-jobs:
    get:
      summary: 查询导入任务
      operationId: listImportJobs
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: 持久化导入源文件并异步预检
      description: 返回 pending/preflight 任务，轮询任务直到 awaiting_confirmation 后再确认；同键不同内容返回 409。
      operationId: createImportJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "202": { $ref: "#/components/responses/Task" }
        "200": { $ref: "#/components/responses/Task" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /import-jobs/{id}/errors:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      summary: 下载导入预检错误报告
      description: 仅任务创建者可下载；报告为逐行 JSON，源文件与报告均由 MinIO 生命周期策略自动清理。
      operationId: downloadImportJobErrors
      responses:
        "200":
          description: 导入预检错误报告文件流
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /export-jobs:
    get:
      summary: 查询导出任务
      operationId: listExportJobs
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: 创建导出任务
      operationId: createExportJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "202": { $ref: "#/components/responses/Task" }
        "200": { $ref: "#/components/responses/Task" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /export-jobs/{id}/download:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      summary: 下载已完成的导出文件
      operationId: downloadExportJob
      responses:
        "200":
          description: 导出文件流
          content:
            text/csv:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /migrations/{type}/{legacyId}:
    parameters:
      - $ref: "#/components/parameters/AssetType"
      - name: legacyId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
    post:
      summary: 按旧库主键幂等迁移资产
      operationId: migrateLegacyAsset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyMigrationRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /import-jobs/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      summary: 确认提交已通过预检的导入任务
      operationId: confirmImportJob
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      summary: 查询任务状态与进度
      operationId: getTask
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /tasks/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      summary: 取消可取消的任务
      operationId: cancelTask
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /reporting/{report}:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string }
    get:
      summary: 获取指定报表
      operationId: getReport
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /workflows/{workflow}:
    parameters:
      - name: workflow
        in: path
        required: true
        schema: { type: string }
    get:
      summary: 获取指定工作流
      operationId: getWorkflow
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /risks/{riskId}:
    parameters:
      - name: riskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: 获取指定风险记录
      operationId: getRisk
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AssetType:
      name: type
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,63}$" }
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string }
        service: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        password: { type: string, minLength: 12, maxLength: 256 }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 256 }
        new_password: { type: string, minLength: 12, maxLength: 256 }
    Principal:
      type: object
      additionalProperties: false
      required: [user_id, username, display_name, roles, data_scope, permissions_version, must_change_password]
      properties:
        user_id: { type: string }
        username: { type: string }
        display_name: { type: string }
        department_id: { type: string }
        roles:
          type: array
          items: { type: string, enum: [reporter, reviewer, auditor, admin] }
        data_scope: { type: string, enum: [own, department, descendants, global] }
        permissions_version: { type: integer, format: int64 }
        must_change_password: { type: boolean }
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 900 }
        user: { $ref: "#/components/schemas/Principal" }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, password, roles, data_scope]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 12, maxLength: 256 }
        department_id: { type: string }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [reporter, reviewer, auditor, admin] }
        data_scope: { type: string, enum: [own, department, descendants, global] }
        must_change_password: { type: boolean }
    UpdateUserAccessRequest:
      type: object
      additionalProperties: false
      required: [enabled, roles, data_scope]
      properties:
        enabled: { type: boolean }
        department_id: { type: string }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [reporter, reviewer, auditor, admin] }
        data_scope: { type: string, enum: [own, department, descendants, global] }
    CreateDepartmentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parent_id: { type: string }
    AssetFields:
      oneOf:
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/ResponsibleDepartmentAsset" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/SupplyChainAsset" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/VulnerabilityAsset" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/HardwareSoftwareAsset" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/SoftwareStatisticsAsset" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/DataAsset" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/SystemInfoAsset" }
    AssetPatchFields:
      oneOf:
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/ResponsibleDepartmentAssetPatch" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/SupplyChainAssetPatch" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/VulnerabilityAssetPatch" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/HardwareSoftwareAssetPatch" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/SoftwareStatisticsAssetPatch" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/DataAssetPatch" }
        - { $ref: "../generated/assets.schemas.yaml#/components/schemas/SystemInfoAssetPatch" }
    CreateAssetRequest:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        department_id: { type: string }
        fields: { $ref: "#/components/schemas/AssetFields" }
    LegacyMigrationRequest:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        department_id: { type: string, format: uuid }
        is_deleted: { type: boolean, default: false }
        fields: { $ref: "#/components/schemas/AssetFields" }
    UpdateAssetRequest:
      type: object
      additionalProperties: false
      required: [version, fields]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        fields: { $ref: "#/components/schemas/AssetPatchFields" }
    VersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
    Task:
      type: object
      required: [id, kind, asset_type, phase, state, progress, attempt, max_attempts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [import, export] }
        asset_type: { type: string }
        phase: { type: string, enum: [preflight, execution], description: 预检与正式执行使用独立派发代次和租约，确认后重置重试预算。 }
        state: { type: string, enum: [pending, running, awaiting_confirmation, succeeded, failed, cancelled, dead_letter] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        attempt: { type: integer }
        max_attempts: { type: integer }
        result: { type: object, additionalProperties: true }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JobRequest:
      type: object
      additionalProperties: false
      required: [asset_type, idempotency_key]
      properties:
        asset_type: { type: string }
        idempotency_key: { type: string, minLength: 1, maxLength: 200 }
        department_id: { type: string, format: uuid }
        csv: { type: string, description: UTF-8 CSV；导入任务必填。服务端持久化文件后返回；Worker 带租约预检，等待确认后才执行导入。 }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    Task:
      description: 任务已持久化；预检完成前不得确认。重复请求返回同一任务。
      content:
        application/json:
          schema:
            type: object
            required: [task]
            properties:
              task: { $ref: "#/components/schemas/Task" }
              created: { type: boolean }
    Success:
      description: 请求成功
      content:
        application/json:
          schema: { type: object }
    Error:
      description: 标准错误响应
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

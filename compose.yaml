name: asset-governance

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asset_platform}
      POSTGRES_USER: ${POSTGRES_USER:-asset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-asset}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-asset}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  iam-service:
    build:
      context: ./platform
      args: { SERVICE: iam-service }
    environment: &service-env
      SHUTDOWN_TIMEOUT: 10s
      MAX_BODY_BYTES: 1048576
      DATABASE_URL: postgres://${POSTGRES_USER:-asset}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-asset_platform}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-asset}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      IAM_BOOTSTRAP_ADMIN_USERNAME: ${IAM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      IAM_BOOTSTRAP_ADMIN_PASSWORD: ${IAM_BOOTSTRAP_ADMIN_PASSWORD:?IAM_BOOTSTRAP_ADMIN_PASSWORD is required}
      IAM_COOKIE_SECURE: ${IAM_COOKIE_SECURE:-false}
      IAM_TOKEN_ISSUER: ${IAM_TOKEN_ISSUER:-asset-platform-iam}
      IAM_TOKEN_AUDIENCE: ${IAM_TOKEN_AUDIENCE:-asset-platform}
      IAM_SERVICE_URL: http://iam-service:8081
    depends_on: &infra-ready
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck: &service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  asset-service:
    build:
      context: ./platform
      args: { SERVICE: asset-service }
    environment:
      <<: *service-env
    depends_on:
      <<: *infra-ready
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health/ready"]
    restart: unless-stopped

  governance-service:
    build:
      context: ./platform
      args: { SERVICE: governance-service }
    environment:
      <<: *service-env
    depends_on:
      <<: *infra-ready
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health/ready"]
    restart: unless-stopped

  task-report-service:
    build:
      context: ./platform
      args: { SERVICE: task-report-service }
    environment:
      <<: *service-env
    depends_on:
      <<: *infra-ready
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health/ready"]
    restart: unless-stopped

  gateway:
    build:
      context: ./platform
      args: { SERVICE: gateway }
    environment:
      HTTP_ADDR: :8080
      IAM_SERVICE_URL: http://iam-service:8081
      ASSET_SERVICE_URL: http://asset-service:8082
      GOVERNANCE_SERVICE_URL: http://governance-service:8083
      TASK_REPORT_SERVICE_URL: http://task-report-service:8084
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8088},http://localhost:5173
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      iam-service: { condition: service_healthy }
      asset-service: { condition: service_healthy }
      governance-service: { condition: service_healthy }
      task-report-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "${WEB_PORT:-8088}:8080"
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:

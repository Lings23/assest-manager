name: asset-governance

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asset_platform}
      POSTGRES_USER: ${POSTGRES_USER:-asset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-asset}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-asset}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  iam-migrate:
    build: { context: ./platform, args: { SERVICE: iam-service } }
    command: ["--migrate-only"]
    environment:
      DATABASE_URL: &database-url postgres://${POSTGRES_USER:-asset}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-asset_platform}?sslmode=disable
      IAM_BOOTSTRAP_ADMIN_USERNAME: ${IAM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      IAM_BOOTSTRAP_ADMIN_PASSWORD: ${IAM_BOOTSTRAP_ADMIN_PASSWORD:?IAM_BOOTSTRAP_ADMIN_PASSWORD is required}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  asset-migrate:
    build: { context: ./platform, args: { SERVICE: asset-service } }
    command: ["--migrate-only"]
    environment: { DATABASE_URL: *database-url }
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  task-migrate:
    build: { context: ./platform, args: { SERVICE: task-report-service } }
    command: ["--migrate-only", "--init-objects"]
    environment: &object-env
      DATABASE_URL: *database-url
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-asset-exports}
      S3_RETENTION_DAYS: ${S3_RETENTION_DAYS:-7}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-asset}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: "no"

  iam-service:
    build: { context: ./platform, args: { SERVICE: iam-service } }
    environment:
      <<: &http-env
        DATABASE_URL: *database-url
        DRAIN_DELAY: ${DRAIN_DELAY:-7s}
        SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-130s}
        HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-120s}
        HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-120s}
        HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-30s}
        HTTP_FILE_TIMEOUT: ${HTTP_FILE_TIMEOUT:-120s}
        APP_VERSION: ${APP_VERSION:-dev}
        MAX_BODY_BYTES: 1048576
      DB_MAX_CONNS: ${IAM_DB_MAX_CONNS:-5}
      IAM_PRIVATE_KEY_FILE: /run/secrets/iam_private_key
      IAM_COOKIE_SECURE: ${IAM_COOKIE_SECURE:-false}
      IAM_TOKEN_ISSUER: ${IAM_TOKEN_ISSUER:-asset-platform-iam}
      IAM_TOKEN_AUDIENCE: ${IAM_TOKEN_AUDIENCE:-asset-platform}
      TRUSTED_PROXY_CIDRS: ${APP_SUBNET:-172.30.240.0/24}
    secrets: [iam_private_key]
    depends_on:
      iam-migrate: { condition: service_completed_successfully }
    healthcheck: &service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30
    stop_grace_period: ${HTTP_STOP_GRACE_PERIOD:-150s}
    deploy: { replicas: 2, resources: { limits: { cpus: '0.5', memory: 256M } } }
    restart: unless-stopped

  asset-service:
    build: { context: ./platform, args: { SERVICE: asset-service } }
    environment:
      <<: *http-env
      DB_MAX_CONNS: ${ASSET_DB_MAX_CONNS:-5}
      IAM_SERVICE_URL: http://service-lb:18081
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      asset-migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health/ready"]
    stop_grace_period: ${HTTP_STOP_GRACE_PERIOD:-150s}
    deploy: { replicas: 2, resources: { limits: { cpus: '1', memory: 384M } } }
    restart: unless-stopped

  governance-service:
    build: { context: ./platform, args: { SERVICE: governance-service } }
    environment: *http-env
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health/ready"]
    stop_grace_period: ${HTTP_STOP_GRACE_PERIOD:-150s}
    restart: unless-stopped

  task-report-service:
    build: { context: ./platform, args: { SERVICE: task-report-service } }
    environment:
      <<: [*object-env, *http-env]
      DB_MAX_CONNS: ${TASK_DB_MAX_CONNS:-4}
      MAX_BODY_BYTES: 104857600
      IAM_SERVICE_URL: http://service-lb:18081
      ASSET_SERVICE_URL: http://service-lb:18082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      task-migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health/ready"]
    stop_grace_period: ${HTTP_STOP_GRACE_PERIOD:-150s}
    deploy: { replicas: 2, resources: { limits: { cpus: '1', memory: 512M } } }
    restart: unless-stopped

  task-publisher:
    build: { context: ./platform, args: { SERVICE: task-publisher } }
    environment:
      DATABASE_URL: *database-url
      DB_MAX_CONNS: ${PUBLISHER_DB_MAX_CONNS:-2}
      RABBITMQ_URL: &rabbit-url amqp://${RABBITMQ_USER:-asset}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/?heartbeat=10
    depends_on:
      task-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/health/ready"]
    deploy: { replicas: 2, resources: { limits: { cpus: '0.5', memory: 192M } } }
    restart: unless-stopped

  task-worker:
    build: { context: ./platform, args: { SERVICE: task-worker } }
    environment:
      <<: *object-env
      DB_MAX_CONNS: ${WORKER_DB_MAX_CONNS:-3}
      RABBITMQ_URL: *rabbit-url
      ASSET_SERVICE_URL: http://service-lb:18082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      WORKER_SLOTS: ${WORKER_SLOTS:-1}
      WORKER_LEASE_DURATION: ${WORKER_LEASE_DURATION:-90s}
      WORKER_RENEW_INTERVAL: ${WORKER_RENEW_INTERVAL:-20s}
      WORKER_TASK_TIMEOUT: ${WORKER_TASK_TIMEOUT:-20m}
      RABBITMQ_CONSUMER_TIMEOUT: 30m
      WORKER_RECOVERY_INTERVAL: ${WORKER_RECOVERY_INTERVAL:-10s}
      WORKER_DRAIN_TIMEOUT: ${WORKER_DRAIN_TIMEOUT:-60s}
      WORKER_ALLOW_LEGACY_MESSAGES: ${WORKER_ALLOW_LEGACY_MESSAGES:-false}
    depends_on:
      task-migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/health/ready"]
    stop_grace_period: 75s
    deploy: { replicas: 2, resources: { limits: { cpus: '1', memory: 512M } } }
    restart: unless-stopped

  service-lb:
    build: ./deploy/haproxy
    environment:
      CORS_ORIGIN_1: http://localhost:${WEB_PORT:-8088}
      CORS_ORIGIN_2: http://127.0.0.1:${WEB_PORT:-8088}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${WEB_PORT:-8088}:8080"
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
    stop_grace_period: 135s
    deploy: { resources: { limits: { cpus: '1', memory: 256M } } }
    restart: unless-stopped

  # Explicit fallback for protocol migration; excluded from normal deployments.
  gateway:
    profiles: [gateway-rollback]
    build: { context: ./platform, args: { SERVICE: gateway } }
    environment:
      <<: *http-env
      MAX_BODY_BYTES: 104857600
      IAM_SERVICE_URL: http://service-lb:18081
      ASSET_SERVICE_URL: http://service-lb:18082
      GOVERNANCE_SERVICE_URL: http://service-lb:18083
      TASK_REPORT_SERVICE_URL: http://service-lb:18084
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8088},http://127.0.0.1:${WEB_PORT:-8088},http://localhost:5173,http://127.0.0.1:5173
    stop_grace_period: ${HTTP_STOP_GRACE_PERIOD:-150s}
    restart: unless-stopped

  web-assets:
    build: ./apps/web
    user: "0:0"
    command: ["sh", "-c", "cp -n /usr/share/nginx/html/assets/* /srv/assets/"]
    volumes:
      - web_assets:/srv/assets
    restart: "no"

  web:
    build: ./apps/web
    volumes:
      - web_assets:/srv/assets:ro
    depends_on:
      web-assets: { condition: service_completed_successfully }
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
    restart: unless-stopped

secrets:
  iam_private_key:
    file: ${IAM_PRIVATE_KEY_FILE:-./data/secrets/iam-private.pem}
networks:
  default:
    ipam:
      config: [{ subnet: "${APP_SUBNET:-172.30.240.0/24}" }]
volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  web_assets:
